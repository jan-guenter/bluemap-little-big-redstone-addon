// SPDX-License-Identifier: MIT

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'io.github.janguenter.bluemap-addon.java-conventions'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

sourceSets {
    main.java.srcDir 'modules/bluemap-addon-runtime/src/main/java'
    main.java.srcDir 'modules/bluemap-addon-adapter-api/src/main/java'
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'
    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.debug = true
    options.debugOptions.debugLevel = 'source,lines'
}

tasks.withType(Zip).configureEach {
    entryCompression = ZipEntryCompression.STORED
}

def artifactPins = [
        [key: 'littleBigRedstone', property: 'littleBigRedstoneJar']
]

tasks.named('test', Test).configure {
    artifactPins.each { pin ->
        def exactJar = providers.gradleProperty(pin.property)
        if (exactJar.isPresent()) {
            systemProperty pin.property, exactJar.get()
        }
    }
}

tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.janguenter.bluemap.littlebigredstone',
                'Implementation-Title': addon_name,
                'Implementation-Version': project.version.toString()
        )
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-little-big-redstone-addon' }
    }
    from('LICENSE-BlueMap') { into 'META-INF' }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-little-big-redstone-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-little-big-redstone-addon.md' }
    }
    from('provenance/upstreams.json') { into 'META-INF/bluemap-little-big-redstone' }
}

tasks.named('sourcesJar', Jar).configure {
    includeEmptyDirs = false
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-little-big-redstone-addon' }
    }
    from('LICENSE-BlueMap') { into 'META-INF' }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-little-big-redstone-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-little-big-redstone-addon.md' }
    }
    from('provenance/upstreams.json') { into 'META-INF/bluemap-little-big-redstone' }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def publishedSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }
def sharedRuntimePackage = 'io/github/janguenter/bluemap/addon/runtime/artifact/'
def sharedRuntimeClasses = [
        "${sharedRuntimePackage}ArtifactPin.class",
        "${sharedRuntimePackage}ExactArtifactDetector\$LexedLine.class",
        "${sharedRuntimePackage}ExactArtifactDetector\$QuoteMode.class",
        "${sharedRuntimePackage}ExactArtifactDetector.class"
].collect { it.toString() }
def sharedRuntimeSources = [
        "${sharedRuntimePackage}ArtifactPin.java",
        "${sharedRuntimePackage}ExactArtifactDetector.java"
].collect { it.toString() }
def sharedAdapterApiPackage =
        'io/github/janguenter/bluemap/addon/adapter/api/bluemap523/'
def sharedAdapterApiClasses = [
        'BlueMapRuntimeCompatibility.class',
        'RegistryGuard.class',
        'ResourceExtensionType.class',
        'SyntheticDispatch.class'
].collect { sharedAdapterApiPackage + it }
def sharedAdapterApiSources = [
        'BlueMapRuntimeCompatibility.java',
        'RegistryGuard.java',
        'ResourceExtensionType.java',
        'SyntheticDispatch.java'
].collect { sharedAdapterApiPackage + it }
def legacyAdapterPackage =
        'io/github/janguenter/bluemap/littlebigredstone/adapter/bluemap522/'
def displacedAdapterHelpers = [
        'io/github/janguenter/bluemap/littlebigredstone/adapter/bluemap523/AdapterCompatibility',
        'io/github/janguenter/bluemap/littlebigredstone/adapter/bluemap523/ProfileResourceExtensionType',
        'io/github/janguenter/bluemap/littlebigredstone/adapter/bluemap523/RegistryGuard'
]

tasks.register('verifyGeneratedGallery', Exec) {
    commandLine 'python3', 'gallery/generate.py', '--check'
}

tasks.register('lintGallery', Exec) {
    dependsOn tasks.named('verifyGeneratedGallery')
    commandLine 'python3', 'gallery/lint.py'
}

tasks.register('verifyPinnedArtifacts', Exec) {
    doFirst {
        def arguments = [
                'bluemap-addon-toolkit',
                'artifacts',
                'verify',
                '--manifest',
                'provenance/upstreams.json'
        ]
        artifactPins.each { pin ->
            def value = providers.gradleProperty(pin.property)
            if (!value.isPresent()) {
                throw new GradleException(
                        "Set -P${pin.property} to the exact ${pin.key} runtime JAR."
                )
            }
            arguments.add('--artifact')
            arguments.add("${pin.key}=${value.get()}")
        }
        commandLine arguments
    }
}

tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)
    doLast {
        def zip = new java.util.zip.ZipFile(inputs.files.singleFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'bluemap.addon.json',
                    'io/github/janguenter/bluemap/littlebigredstone/BlueMapLittleBigRedstoneAddon.class',
                    'io/github/janguenter/bluemap/littlebigredstone/adapter/bluemap523/BlueMap523Adapter.class',
                    'META-INF/LICENSE-bluemap-little-big-redstone-addon',
                    'META-INF/LICENSE-BlueMap',
                    'META-INF/NOTICE-bluemap-little-big-redstone-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-little-big-redstone-addon.md',
                    'META-INF/bluemap-little-big-redstone/upstreams.json'
            ] + sharedRuntimeClasses + sharedAdapterApiClasses
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = sharedRuntimeClasses.findAll { shared ->
                entries.count { it == shared } != 1
            } + sharedAdapterApiClasses.findAll { shared ->
                entries.count { it == shared } != 1
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty()) {
                throw new GradleException(
                        "Production JAR shared boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}"
                )
            }
            def descriptor = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('bluemap.addon.json')).getText('UTF-8')
            )
            if (descriptor.id != addon_id
                    || descriptor.entrypoint != 'io.github.janguenter.bluemap.littlebigredstone.BlueMapLittleBigRedstoneAddon'
                    || descriptor.dependencies != []
                    || descriptor['soft-dependencies'] != []) {
                throw new GradleException('BlueMap add-on descriptor mismatch')
            }
            def candidateIds = new groovy.json.JsonSlurper()
                    .parse(file('provenance/upstreams.json')).artifacts*.mod_id
            def forbidden = entries.findAll { entry ->
                entry.endsWith('.jar')
                        || entry == 'META-INF/neoforge.mods.toml'
                        || entry == 'fabric.mod.json'
                        || entry.endsWith('.mixins.json')
                        || entry.startsWith('net/minecraft/')
                        || entry.startsWith('net/neoforged/')
                        || entry.startsWith('gallery/')
                        || entry.startsWith(legacyAdapterPackage)
                        || displacedAdapterHelpers.any { helper -> entry.startsWith(helper) }
                        || entry.endsWith('/bootstrap.json')
                        || entry.startsWith(
                            'io/github/janguenter/bluemap/littlebigredstone/profile/ArtifactPin'
                        )
                        || entry.startsWith(
                            'io/github/janguenter/bluemap/littlebigredstone/profile/ExactArtifactDetector'
                        )
                        || (entry.startsWith(sharedRuntimePackage)
                            && !sharedRuntimeClasses.contains(entry))
                        || (entry.startsWith(sharedAdapterApiPackage)
                            && !sharedAdapterApiClasses.contains(entry))
                        || (entry.endsWith('.class')
                            && !entry.startsWith('io/github/janguenter/bluemap/littlebigredstone/')
                            && !sharedRuntimeClasses.contains(entry)
                            && !sharedAdapterApiClasses.contains(entry))
                        || candidateIds.any { entry.startsWith("assets/${it}/") }
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException(
                        "Production JAR contains forbidden entries: ${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifySourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)
    doLast {
        def zip = new java.util.zip.ZipFile(inputs.files.singleFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'io/github/janguenter/bluemap/littlebigredstone/BlueMapLittleBigRedstoneAddon.java',
                    'io/github/janguenter/bluemap/littlebigredstone/adapter/bluemap523/BlueMap523Adapter.java',
                    'io/github/janguenter/bluemap/littlebigredstone/adapter/bluemap523/InstalledMicrochipModels.java',
                    'bluemap.addon.json',
                    'META-INF/LICENSE-bluemap-little-big-redstone-addon',
                    'META-INF/LICENSE-BlueMap',
                    'META-INF/bluemap-little-big-redstone/upstreams.json'
            ] + sharedRuntimeSources + sharedAdapterApiSources
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = sharedRuntimeSources.findAll { shared ->
                entries.count { it == shared } != 1
            } + sharedAdapterApiSources.findAll { shared ->
                entries.count { it == shared } != 1
            }
            def projectJava = entries.findAll { it.endsWith('.java') }
            def foreignJava = projectJava.findAll {
                !it.startsWith('io/github/janguenter/bluemap/littlebigredstone/')
                        && !sharedRuntimeSources.contains(it)
                        && !sharedAdapterApiSources.contains(it)
            }
            def candidateIds = new groovy.json.JsonSlurper()
                    .parse(file('provenance/upstreams.json')).artifacts*.mod_id
            def forbidden = entries.findAll { entry ->
                entry.endsWith('.class')
                        || entry.endsWith('.jar')
                        || entry == 'META-INF/neoforge.mods.toml'
                        || entry == 'fabric.mod.json'
                        || entry.endsWith('.mixins.json')
                        || entry.startsWith('net/minecraft/')
                        || entry.startsWith('net/neoforged/')
                        || entry.startsWith('gallery/')
                        || entry.startsWith(legacyAdapterPackage)
                        || displacedAdapterHelpers.any { helper -> entry == "${helper}.java" }
                        || entry.endsWith('/bootstrap.json')
                        || entry == 'io/github/janguenter/bluemap/littlebigredstone/profile/ArtifactPin.java'
                        || entry == 'io/github/janguenter/bluemap/littlebigredstone/profile/ExactArtifactDetector.java'
                        || (entry.startsWith(sharedRuntimePackage)
                            && !sharedRuntimeSources.contains(entry))
                        || (entry.startsWith(sharedAdapterApiPackage)
                            && !sharedAdapterApiSources.contains(entry))
                        || candidateIds.any { entry.startsWith("assets/${it}/") }
            }
            if (!missing.isEmpty()
                    || !duplicateShared.isEmpty()
                    || projectJava.isEmpty()
                    || !foreignJava.isEmpty()
                    || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Sources JAR boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}, "
                                + "foreignJava=${foreignJava}, forbidden=${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
}

tasks.register('prototypeCheck') {
    dependsOn tasks.named('check')
    dependsOn tasks.named('verifyPinnedArtifacts')
    dependsOn tasks.named('lintGallery')
}

def verifyAcceptedFile = { File candidate, String sizeProperty, String hashProperty ->
    def expectedSize = providers.gradleProperty(sizeProperty).get().toLong()
    def expectedSha256 = providers.gradleProperty(hashProperty).get()
    if (expectedSize <= 0 || expectedSha256 == 'PENDING') {
        throw new GradleException("Release identity ${sizeProperty}/${hashProperty} is unsealed")
    }
    def actualSha256 = java.security.MessageDigest.getInstance('SHA-256')
            .digest(candidate.bytes)
            .encodeHex()
            .toString()
    if (candidate.length() != expectedSize || actualSha256 != expectedSha256) {
        throw new GradleException(
                "Accepted artifact mismatch for ${candidate}: "
                        + "${candidate.length()} bytes, SHA-256 ${actualSha256}"
        )
    }
}

tasks.register('verifyAcceptedProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)
    doLast {
        verifyAcceptedFile(
                inputs.files.singleFile,
                'accepted_jar_size',
                'accepted_jar_sha256'
        )
    }
}

tasks.register('verifyAcceptedSourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)
    doLast {
        verifyAcceptedFile(
                inputs.files.singleFile,
                'accepted_sources_jar_size',
                'accepted_sources_jar_sha256'
        )
    }
}

tasks.register('verifyNoScaffoldMarkers') {
    def markerFiles = files(
            fileTree('src') {
                include '**/*.java', '**/*.json', '**/*.toml', '**/*.mcmeta'
            },
            fileTree('gallery') {
                include '**/*.py', '**/*.sh', '**/*.md', '**/*.json',
                        '**/*.mcmeta', '**/*.mcfunction', '**/*.tsv'
            },
            fileTree('tools') { include '**/*.py', '**/*.sh' },
            fileTree('docs') { include '**/*.md' },
            fileTree('.github') { include '**/*.yml', '**/*.yaml' },
            fileTree('provenance') { include '**/*.json' },
            files(
                    'AGENTS.md', 'CHANGELOG.md', 'README.md', 'NOTICE.md',
                    'THIRD_PARTY.md', 'build.gradle', 'settings.gradle',
                    'gradle.properties'
            )
    )
    inputs.files(markerFiles)
    doLast {
        def implementationMarker = 'SCAFFOLD_' + 'NOT_IMPLEMENTED'
        def unresolvedPattern = ~/@{2}[A-Z][A-Z0-9_]*@{2}/
        def violations = []
        markerFiles.files.findAll { it.isFile() }.sort().each { candidate ->
            def content = candidate.getText('UTF-8')
            if (content.contains(implementationMarker)
                    || unresolvedPattern.matcher(content).find()) {
                violations.add(project.relativePath(candidate))
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Release scaffold markers remain: ${violations}")
        }
    }
}

tasks.register('verifyStagedEquivalence', Exec) {
    dependsOn tasks.named('jar')
    doFirst {
        commandLine 'bluemap-addon-toolkit', 'jar-entries', 'verify',
                '--jar', productionJar.get().asFile,
                '--entries', 'provenance/accepted-staging-entries.sha256',
                '--expected-version', project.version.toString()
    }
}

tasks.register('verifyPublicationArtifacts') {
    dependsOn tasks.named('generatePomFileForAddonPublication')
    dependsOn tasks.named('generateMetadataFileForAddonPublication')
    doLast {
        verifyAcceptedFile(
                file('build/publications/addon/pom-default.xml'),
                'accepted_pom_size',
                'accepted_pom_sha256'
        )
        verifyAcceptedFile(
                file('build/publications/addon/module.json'),
                'accepted_module_size',
                'accepted_module_sha256'
        )
        def module = new groovy.json.JsonSlurper()
                .parse(file('build/publications/addon/module.json'))
        def pom = file('build/publications/addon/pom-default.xml').text
        if (!pom.contains("<version>${project.version}</version>")
                || module.component.version != project.version.toString()
                || project.version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException('Publication metadata is not the final release version')
        }
    }
}

tasks.register('verifyReleaseMetadata') {
    doLast {
        def expectedTag = "v${project.version}"
        def requestedTag = providers.gradleProperty('releaseTag').getOrElse('')
        if (project.version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException('Release versions must not end in -SNAPSHOT')
        }
        if (requestedTag != expectedTag) {
            throw new GradleException(
                    "Release tag mismatch: ${requestedTag ?: '<unset>'} != ${expectedTag}"
            )
        }
        def release = new groovy.json.JsonSlurper()
                .parse(file('provenance/release.json'))
        def expectedRepository = 'https://github.com/jan-guenter/bluemap-little-big-redstone-addon'
        def exactProductionRuntime = release.exact_production_runtime
        if (release.status != 'owner-accepted-release-candidate'
                || release.version != project.version.toString()
                || release.repository != expectedRepository
                || !(release.owner_accepted_staging instanceof Map)
                || release.owner_accepted_staging.isEmpty()
                || release.owner_accepted_staging.visual_acceptance != true
                || !(release.accepted_staging_entries instanceof Map)
                || release.accepted_staging_entries.isEmpty()
                || !(release.final_release_artifacts instanceof Map)
                || release.final_release_artifacts.isEmpty()
                || !(exactProductionRuntime instanceof Map)
                || exactProductionRuntime.status != 'passed'
                || exactProductionRuntime.sealed != true
                || exactProductionRuntime.remaining_artifact_or_render_gap != false) {
            throw new GradleException('Release provenance is not sealed')
        }

        def entryManifest = file('provenance/accepted-staging-entries.sha256')
        def acceptedEntries = release.accepted_staging_entries
        def entryLines = entryManifest.readLines('UTF-8').findAll { !it.isBlank() }
        def entrySha256 = java.security.MessageDigest.getInstance('SHA-256')
                .digest(entryManifest.bytes).encodeHex().toString()
        if (acceptedEntries.path != 'provenance/accepted-staging-entries.sha256'
                || acceptedEntries.entry_count != entryLines.size()
                || acceptedEntries.sha256 != entrySha256) {
            throw new GradleException('Accepted staging entry provenance mismatch')
        }

        def expectedArtifacts = [
                production_jar: [
                        file_name: "${artifact_id}-${project.version}.jar".toString(),
                        size: providers.gradleProperty('accepted_jar_size').get().toLong(),
                        sha256: providers.gradleProperty('accepted_jar_sha256').get()
                ],
                sources_jar: [
                        file_name: "${artifact_id}-${project.version}-sources.jar".toString(),
                        size: providers.gradleProperty('accepted_sources_jar_size').get().toLong(),
                        sha256: providers.gradleProperty('accepted_sources_jar_sha256').get()
                ],
                pom: [
                        file_name: "${artifact_id}-${project.version}.pom".toString(),
                        size: providers.gradleProperty('accepted_pom_size').get().toLong(),
                        sha256: providers.gradleProperty('accepted_pom_sha256').get()
                ],
                gradle_module: [
                        file_name: "${artifact_id}-${project.version}.module.json".toString(),
                        size: providers.gradleProperty('accepted_module_size').get().toLong(),
                        sha256: providers.gradleProperty('accepted_module_sha256').get()
                ]
        ]
        expectedArtifacts.each { name, expected ->
            def recorded = release.final_release_artifacts[name]
            if (!(recorded instanceof Map)
                    || recorded.file_name != expected.file_name
                    || recorded.size != expected.size
                    || recorded.sha256 != expected.sha256) {
                throw new GradleException("Release provenance mismatch for ${name}")
            }
        }

        def exactRuntimeJar = exactProductionRuntime.production_jar
        def exactRuntimeEvidence = exactProductionRuntime.evidence
        def exactRuntimeSource = exactProductionRuntime.source
        def exactRuntimeState = exactProductionRuntime.runtime
        def exactRuntimeGallery = exactProductionRuntime.gallery
        def exactRuntimeRender = exactProductionRuntime.bounded_render
        if (!(exactRuntimeJar instanceof Map)
                || exactRuntimeJar.file_name != expectedArtifacts.production_jar.file_name
                || exactRuntimeJar.size != expectedArtifacts.production_jar.size
                || exactRuntimeJar.sha256 != expectedArtifacts.production_jar.sha256
                || exactRuntimeJar.zip_integrity_passed != true
                || exactRuntimeJar.on_disk_identity_passed != true
                || !(exactRuntimeEvidence instanceof Map)
                || exactRuntimeEvidence.summary_path != 'evidence/exact-production-summary.json'
                || exactRuntimeEvidence.summary_sha256
                    != 'dba10100e0ae6df4a8d0035ed09b9863dc567bb9570fb62143a57c71e8763ec9'
                || exactRuntimeEvidence.checksum_manifest_path != 'SHA256SUMS'
                || exactRuntimeEvidence.checksum_manifest_sha256
                    != '1bca8a16c172deea9d5d2e0a667b50969f4aa45dc2385d77db122d0782cd735e'
                || exactRuntimeEvidence.file_count != 128
                || exactRuntimeEvidence.checksum_check_passed != true
                || !(exactRuntimeSource instanceof Map)
                || exactRuntimeSource.commit
                    != 'c2540e8eeca9ddb23be5c65d77b69c8967d1f8ae'
                || exactRuntimeSource.tree
                    != '2f9cb8c28504c961a96e76f8a3154418e420a917'
                || exactRuntimeSource.signed_commit_verified != true
                || !(exactRuntimeState instanceof Map)
                || exactRuntimeState.status != 'passed'
                || exactRuntimeState.pod_restart_count != 0
                || exactRuntimeState.addon_load_markers != 1
                || exactRuntimeState.addon_active_markers != 1
                || exactRuntimeState.addon_inactive_markers != 0
                || exactRuntimeState.addon_fallback_markers != 0
                || !(exactRuntimeGallery instanceof Map)
                || exactRuntimeGallery.status != 'passed'
                || exactRuntimeGallery.case_count != 17
                || exactRuntimeGallery.post_verification_failures != 0
                || !(exactRuntimeRender instanceof Map)
                || exactRuntimeRender.status != 'passed'
                || exactRuntimeRender.complete_tile_count != 4
                || exactRuntimeRender.all_tiles_fresh_after_command != true
                || exactRuntimeRender
                    .compressed_and_decoded_tiles_byte_identical_to_accepted_overlay
                    != true) {
            throw new GradleException('Exact production runtime provenance mismatch')
        }
    }
}

tasks.register('verifyReleaseCandidate') {
    dependsOn tasks.named('prototypeCheck')
    dependsOn tasks.named('verifyAcceptedProductionJar')
    dependsOn tasks.named('verifyAcceptedSourcesJar')
    dependsOn tasks.named('verifyNoScaffoldMarkers')
    dependsOn tasks.named('verifyStagedEquivalence')
    dependsOn tasks.named('verifyPublicationArtifacts')
    dependsOn tasks.named('verifyReleaseMetadata')
}

publishing {
    publications {
        addon(MavenPublication) {
            from components.java
            artifactId = artifact_id
            pom {
                name = addon_name
                description = 'Exact-profile BlueMap rendering for Little Big Redstone.'
                url = 'https://github.com/jan-guenter/bluemap-little-big-redstone-addon'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://spdx.org/licenses/MIT.html'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/jan-guenter/bluemap-little-big-redstone-addon'
                    connection = 'scm:git:https://github.com/jan-guenter/bluemap-little-big-redstone-addon.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jan-guenter/bluemap-little-big-redstone-addon')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
